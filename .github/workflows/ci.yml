
name: Trade Store CI Pipeline

on:
  push:
    branches: [main, master, feature/kafka-ingestion]
  pull_request:
    branches: [main, master, feature/kafka-ingestion]

jobs:
  test-and-scan:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trade_app
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: trade_store_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trade_app -d trade_store_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-kafka.txt
          pip install pip-audit

      - name: Initialize test database schema
        env:
          DATABASE_URL: postgresql+psycopg://trade_app:test_password@localhost:5432/trade_store_test
          PYTHONPATH: .
        run: |
          python -c "from app.database import Base, engine; from app.models import Trade; Base.metadata.create_all(bind=engine)"

      - name: Run automated tests
        env:
          DATABASE_URL: postgresql+psycopg://trade_app:test_password@localhost:5432/trade_store_test
          PYTHONPATH: .
        run: |
          python -m pytest -v --cov=app --cov-report=term-missing

      - name: Open-source dependency vulnerability scan
        run: |
          pip-audit --strict --progress-spinner off
  
  deploy-to-ec2:
    name: Deploy to AWS EC2
    needs: test-and-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Deploy application
        run: |
          cd /home/ubuntu/dws-trade-store
          git fetch origin master
          git reset --hard origin/master

          source .venv/bin/activate
          pip install -r requirements.txt
          pip install -r requirements-kafka.txt

          python -c "from app.database import Base, engine; from app.models import Trade; Base.metadata.create_all(bind=engine)"

          sudo systemctl restart trade-store
          sleep 5
          curl -fsS http://127.0.0.1/health


  deploy-kafka-to-ec2:
    name: Deploy Kafka Branch to Backup EC2
    needs: test-and-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/kafka-ingestion'
    runs-on: [self-hosted, linux, x64, dws-kafka-backup]

    steps:
      - name: Deploy Kafka application
        run: |
          set -e

          cd /home/ubuntu/dws-trade-store

          git fetch origin feature/kafka-ingestion
          git reset --hard origin/feature/kafka-ingestion

          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install -r requirements-kafka.txt

          .venv/bin/python -c "from app.database import Base, engine; from app.models import Trade; Base.metadata.create_all(bind=engine)"

          sudo systemctl restart trade-store
          sudo systemctl restart trade-store-consumer

          sleep 5
          curl -fsS http://127.0.0.1:8000/health

          sudo systemctl is-active trade-store-consumer
          sudo docker inspect -f '{{.State.Running}}' dws-trade-kafka
